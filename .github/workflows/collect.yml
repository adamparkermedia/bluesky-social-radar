
name: Bluesky Social Radar Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 1-4'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Bluesky posts
        run: python collect.py --actor adamparkr.bsky.social --hours 24 --workers 5

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-social-radar
          path: output/
          if-no-files-found: warn
          retention-days: 7
